<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Entenda seu mel</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Montserrat:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#FFFCF1;font-family:Montserrat,sans-serif;color:#161512;position:relative;overflow:hidden;display:flex;flex-direction:column">
<div aria-hidden="true" style="height:54px;flex:none"></div>
<header style="height:56px;flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 16px;position:relative;z-index:2"><a href="App05Home.dc.html" aria-label="Voltar" style="width:44px;height:44px;border-radius:50%;background:#FFFCF1;border:1.5px solid #161512;display:flex;align-items:center;justify-content:center;box-sizing:border-box;flex:none"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#161512" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a><span style="font-size:13px;font-weight:700;letter-spacing:.06em">GUIA</span><div style="display:flex;gap:8px;min-width:44px;justify-content:flex-end"></div></header>
<main style="flex:1;min-height:0;overflow:hidden;position:relative;display:flex;flex-direction:column">
<div style="padding:0 20px;display:flex;flex-direction:column;gap:10px">
<h1 style="margin:0;font-family:Anton,sans-serif;font-weight:400;font-size:46px;line-height:.92;">ENTENDA<br>SEU MEL</h1>
<span style="font-size:14px;color:#3D3A32;font-weight:500;margin-bottom:4px">Respostas curtas para as dúvidas mais comuns.</span>
<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px">
<sc-for list="{{qs}}" as="q" hint-placeholder-count="6">
<button type="button" onClick="{{q.open}}" style="{{q.card}}"><span style="{{q.hex}}">{{q.n}}</span><span style="font:700 14px/1.25 Montserrat,sans-serif;color:#161512;text-align:left">{{q.t}}</span><span style="margin-top:auto;font:700 10px Montserrat,sans-serif;letter-spacing:.1em;color:#161512">LER →</span></button>
</sc-for>
</div>
</div>
</main>
<nav aria-label="Navegação principal" style="height:88px;flex:none;box-sizing:border-box;border-top:1px solid #E6DFC4;background:#FFFCF1;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:start;padding:6px 6px 34px;position:relative;z-index:3"><a href="App05Home.dc.html" aria-current="page" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;color:#161512;font-size:10px;font-weight:700;min-height:44px"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#161512" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-6 8 6v9H4z"></path><path d="M10 20v-5h4v5"></path></svg>Início<span style="width:6px;height:7px;background:#FFDE59;display:block;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);margin-top:1px"></span></a><a href="App17Meis.dc.html" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;color:#5E5A4E;font-size:10px;font-weight:600;min-height:44px"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#5E5A4E" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"></path></svg>Méis<span style="width:6px;height:7px;background:transparent;display:block;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);margin-top:1px"></span></a><a href="App06Scanner.dc.html" aria-label="Escanear QR Code" style="display:flex;flex-direction:column;align-items:center;gap:2px;margin-top:-30px;text-decoration:none;color:#161512;font-size:10px;font-weight:700"><span style="width:66px;height:76px;background:#161512;display:flex;align-items:center;justify-content:center;flex:none;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);"><span style="width:58px;height:67px;background:#FFDE59;display:flex;align-items:center;justify-content:center;flex:none;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#161512" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"></path><path d="M7 12h10"></path></svg></span></span>SCAN</a><a href="App18Produtores.dc.html" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;color:#5E5A4E;font-size:10px;font-weight:600;min-height:44px"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#5E5A4E" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="3.5"></circle><path d="M5 20c1-4 4-6 7-6s6 2 7 6"></path></svg>Produtores<span style="width:6px;height:7px;background:transparent;display:block;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);margin-top:1px"></span></a><a href="App21Salvos.dc.html" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;color:#5E5A4E;font-size:10px;font-weight:600;min-height:44px"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#5E5A4E" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 4h12v16l-6-4-6 4z"></path></svg>Salvos<span style="width:6px;height:7px;background:transparent;display:block;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);margin-top:1px"></span></a></nav>
<sc-if value="{{isOpen}}" hint-placeholder-val="{{ false }}">
<div style="position:absolute;inset:0;z-index:6;display:flex;flex-direction:column;justify-content:flex-end">
<button type="button" aria-label="Fechar" onClick="{{close}}" style="position:absolute;inset:0;border:0;background:rgba(22,21,18,.5);cursor:pointer"></button>
<section role="dialog" aria-label="{{cur.t}}" style="position:relative;background:#FFFCF1;border-radius:28px 28px 0 0;padding:14px 22px 44px;display:flex;flex-direction:column;gap:14px">
<span aria-hidden="true" style="align-self:center;width:40px;height:5px;border-radius:3px;background:#D9D1B4"></span>
<div style="display:flex;justify-content:space-between;align-items:center"><span style="{{cur.hex}}">{{cur.n}}</span><button type="button" aria-label="Fechar" onClick="{{close}}" style="width:44px;height:44px;border-radius:50%;border:1.5px solid #161512;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#161512" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></div>
<h2 style="margin:0;font-family:Anton,sans-serif;font-weight:400;font-size:32px;line-height:.98">{{cur.tUp}}</h2>
<p style="margin:0;font-size:16px;line-height:1.6">{{cur.a}}</p>
<div style="display:flex;gap:6px;flex-wrap:wrap"><sc-for list="{{cur.tags}}" as="tg" hint-placeholder-count="3"><span style="border:1px solid #161512;padding:4px 11px;border-radius:999px;font-size:12px;font-weight:700">{{tg}}</span></sc-for></div>
</section></div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { o: -1 }; }
  renderVals() {
    const Q = [
      { t: 'Por que cristaliza?', a: 'A cristalização é um comportamento natural do mel. A velocidade varia conforme composição, florada e temperatura — não é defeito. Para voltar ao estado líquido: banho-maria morno, sem ferver.', tags: ['Natural', 'Não é defeito'], c: '#FFDE59' },
      { t: 'O que é florada?', a: 'São as flores de onde as abelhas coletaram o néctar. É a principal razão de um mel ser diferente do outro.', tags: ['Laranjeira', 'Eucalipto', 'Multifloral'], c: '#F6DC6B' },
      { t: 'Por que a cor muda?', a: 'A cor depende principalmente da florada. Com o tempo e o calor, o mel pode escurecer um pouco. Clara ou escura, a cor não indica qualidade maior ou menor.', tags: ['Florada', 'Tempo', 'Calor'], c: '#E9A23B' },
      { t: 'Méis podem ter sabores diferentes?', a: 'Sim. Aroma e sabor vêm das flores visitadas. Em geral, méis claros tendem a ser mais suaves e os escuros, mais intensos — é uma tendência, não uma regra.', tags: ['Suave', 'Intenso'], c: '#C2C76E' },
      { t: 'Como conservar?', a: 'Pote bem fechado, em local seco, longe do sol e do calor. Temperatura ambiente — não precisa de geladeira. Use colher limpa e seca.', tags: ['Fechado', 'Seco', 'Sem sol'], c: '#FFF0B6' },
      { t: 'O que significa multifloral?', a: 'É o mel feito a partir do néctar de várias espécies de flores, sem predominância de uma só. Por isso, suas características podem variar de uma colheita para outra.', tags: ['Várias flores', 'Varia por colheita'], c: '#E6DFC4' }
    ];
    const hex = (c) => 'width:40px;height:46px;background:' + c + ';display:flex;align-items:center;justify-content:center;font-family:Anton,sans-serif;font-size:16px;color:#161512;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)';
    const qs = Q.map((q, i) => ({ ...q, n: '0' + (i + 1), tUp: q.t.toUpperCase(), hex: hex(q.c),
      card: 'min-height:128px;background:' + (i === 0 ? '#FFF0B6' : '#FFFFFF') + ';border:1px solid ' + (i === 0 ? '#FFF0B6' : '#E6DFC4') + ';border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px;align-items:flex-start;cursor:pointer',
      open: () => this.setState({ o: i }) }));
    const o = this.state.o;
    return { qs, isOpen: o > -1, cur: o > -1 ? qs[o] : qs[0], close: () => this.setState({ o: -1 }) };
  }
}
</script>
</body>
</html>
