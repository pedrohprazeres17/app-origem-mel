<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Explore os méis</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Montserrat:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#FFFCF1;font-family:Montserrat,sans-serif;color:#161512;position:relative;overflow:hidden;display:flex;flex-direction:column">
<div aria-hidden="true" style="height:54px;flex:none"></div>

<main style="flex:1;min-height:0;overflow:hidden;position:relative;display:flex;flex-direction:column">
<div style="padding:6px 20px 0;display:flex;flex-direction:column;gap:10px">
<h1 style="margin:0;font-family:Anton,sans-serif;font-weight:400;font-size:40px;line-height:.92;">EXPLORE OS MÉIS</h1>
<label style="display:flex;align-items:center;gap:10px;border:1.5px solid #161512;border-radius:14px;padding:0 14px;min-height:48px;background:#FFFFFF"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#161512" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4.5 4.5"></path></svg><span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Buscar</span><input type="search" value="{{q}}" onChange="{{setQ}}" placeholder="Buscar mel, produtor ou município" style="flex:1;min-width:0;border:0;outline:none;background:transparent;font:500 15px Montserrat,sans-serif;color:#161512"></label>
<div role="tablist" aria-label="Filtros" style="display:flex;gap:6px;overflow-x:auto;margin:0 -20px;padding:2px 20px;white-space:nowrap"><sc-for list="{{cats}}" as="c" hint-placeholder-count="4"><button type="button" role="tab" aria-selected="{{c.on}}" onClick="{{c.pick}}" style="{{c.style}}">{{c.t}}<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button></sc-for></div>
<div role="group" aria-label="Opções do filtro" style="display:flex;gap:6px;overflow-x:auto;margin:0 -20px;padding:0 20px;white-space:nowrap"><sc-for list="{{opts}}" as="o" hint-placeholder-count="4"><button type="button" aria-pressed="{{o.on}}" onClick="{{o.pick}}" style="{{o.style}}">{{o.t}}</button></sc-for></div>
<span aria-live="polite" style="font-size:11px;font-weight:700;letter-spacing:.1em">{{count}}</span>
<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">
<sc-for list="{{lista}}" as="m" hint-placeholder-count="4">
<a href="App11Mel.dc.html" style="background:#FFFFFF;border:1px solid #E6DFC4;border-radius:16px;overflow:hidden;display:flex;flex-direction:column;text-decoration:none;color:#161512">
<span style="height:92px;background:{{m.tint}};display:flex;align-items:flex-end;justify-content:center;padding-bottom:5px;box-sizing:border-box;position:relative"><span style="position:absolute;top:8px;left:8px;width:13px;height:15px;background:{{m.accent}};display:block;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)"></span><svg viewBox="0 0 120 160" width="56" height="75" aria-hidden="true" style="position:relative;flex:none"><ellipse cx="60" cy="156" rx="44" ry="4" fill="#161512" opacity=".14"></ellipse><rect x="33" y="6" width="54" height="20" rx="5" fill="#161512"></rect><rect x="29" y="25" width="62" height="7" rx="2" fill="#2B2924"></rect><path d="M20 46c0-9 6-14 15-14h50c9 0 15 5 15 14v92c0 9-6 15-15 15H35c-9 0-15-6-15-15z" fill="{{m.accent}}"></path><rect x="27" y="48" width="6" height="92" rx="3" fill="#FFFFFF" opacity=".4"></rect><rect x="36" y="74" width="48" height="50" rx="4" fill="#FFFCF1"></rect><path d="M60 80l6 3.5v7L60 94l-6-3.5v-7z" fill="#161512"></path></svg></span>
<span style="padding:9px 10px 11px;display:flex;flex-direction:column;gap:3px"><b style="font-family:Anton,sans-serif;font-weight:400;font-size:16px;line-height:1">{{m.nomeUp}}</b><span style="font-size:11px;font-weight:600">{{m.prod}}</span><span style="font-size:10px;color:#5E5A4E">{{m.mun}}</span><span style="align-self:flex-start;margin-top:3px;background:{{m.accent}};padding:3px 8px;border-radius:999px;font-size:10px;font-weight:700">{{m.florada}}</span></span>
</a>
</sc-for>
</div>
</div>
</main>
<nav aria-label="Navegação principal" style="height:88px;flex:none;box-sizing:border-box;border-top:1px solid #E6DFC4;background:#FFFCF1;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:start;padding:6px 6px 34px;position:relative;z-index:3"><a href="App05Home.dc.html" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;color:#5E5A4E;font-size:10px;font-weight:600;min-height:44px"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#5E5A4E" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-6 8 6v9H4z"></path><path d="M10 20v-5h4v5"></path></svg>Início<span style="width:6px;height:7px;background:transparent;display:block;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);margin-top:1px"></span></a><a href="App17Meis.dc.html" aria-current="page" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;color:#161512;font-size:10px;font-weight:700;min-height:44px"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#161512" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"></path></svg>Méis<span style="width:6px;height:7px;background:#FFDE59;display:block;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);margin-top:1px"></span></a><a href="App06Scanner.dc.html" aria-label="Escanear QR Code" style="display:flex;flex-direction:column;align-items:center;gap:2px;margin-top:-30px;text-decoration:none;color:#161512;font-size:10px;font-weight:700"><span style="width:66px;height:76px;background:#161512;display:flex;align-items:center;justify-content:center;flex:none;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);"><span style="width:58px;height:67px;background:#FFDE59;display:flex;align-items:center;justify-content:center;flex:none;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#161512" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"></path><path d="M7 12h10"></path></svg></span></span>SCAN</a><a href="App18Produtores.dc.html" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;color:#5E5A4E;font-size:10px;font-weight:600;min-height:44px"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#5E5A4E" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="3.5"></circle><path d="M5 20c1-4 4-6 7-6s6 2 7 6"></path></svg>Produtores<span style="width:6px;height:7px;background:transparent;display:block;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);margin-top:1px"></span></a><a href="App21Salvos.dc.html" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;color:#5E5A4E;font-size:10px;font-weight:600;min-height:44px"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#5E5A4E" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 4h12v16l-6-4-6 4z"></path></svg>Salvos<span style="width:6px;height:7px;background:transparent;display:block;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);margin-top:1px"></span></a></nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { cat: 'Florada', f: { Florada: 'Todas', Origem: 'Todas', Produtor: 'Todos', 'Características': 'Todas' }, q: '' }; }
  renderVals() {
    const M = [
      { id: 'lar', nome: 'Mel de Laranjeira', florada: 'Laranjeira', prod: 'Produtor A', mun: 'São José dos Pinhais', cor: 'Clara', perfil: 'Suave', crist: 'Variável', colheita: 'Novembro / 2026', token: 'MEL-2026-LAR-00421', accent: '#F6DC6B', tint: '#FFF7D1' },
      { id: 'mulb', nome: 'Mel Multifloral', florada: 'Multifloral', prod: 'Produtor B', mun: 'Colombo', cor: 'Âmbar', perfil: 'Marcante', crist: 'Não informado', colheita: 'Não informado', token: 'MEL-2026-MUL-00388', accent: '#E9A23B', tint: '#FCEBD0' },
      { id: 'euc', nome: 'Mel de Eucalipto', florada: 'Eucalipto', prod: 'Produtor C', mun: 'Mandirituba', cor: 'Âmbar', perfil: 'Intenso', crist: 'Variável', colheita: 'Não informado', token: 'MEL-2026-EUC-00157', accent: '#C2C76E', tint: '#F3F3D8' },
      { id: 'mula', nome: 'Mel Multifloral', florada: 'Multifloral', prod: 'Produtor A', mun: 'São José dos Pinhais', cor: 'Variável', perfil: 'Variável', crist: 'Não informado', colheita: 'Não informado', token: 'MEL-2026-MUL-00402', accent: '#E9A23B', tint: '#FCEBD0' }
    ];
    const O = { Florada: ['Todas', 'Laranjeira', 'Eucalipto', 'Multifloral'], Origem: ['Todas', 'São José dos Pinhais', 'Colombo', 'Mandirituba'], Produtor: ['Todos', 'Produtor A', 'Produtor B', 'Produtor C'], 'Características': ['Todas', 'Clara', 'Âmbar', 'Suave', 'Intenso'] };
    const { cat, f, q } = this.state;
    const base = 'display:inline-flex;align-items:center;gap:5px;border-radius:12px;padding:0 13px;min-height:44px;font:700 13px Montserrat,sans-serif;flex:none;cursor:pointer;';
    const isAll = (x) => x === 'Todas' || x === 'Todos';
    const cats = Object.keys(O).map((t) => ({ t: isAll(f[t]) ? t : f[t], on: cat === t, pick: () => this.setState({ cat: t }),
      style: base + (cat === t ? 'background:#161512;color:#FFFCF1;border:1.5px solid #161512' : (isAll(f[t]) ? 'background:transparent;color:#161512;border:1.5px solid #161512' : 'background:#FFDE59;color:#161512;border:1.5px solid #161512')) }));
    const opts = O[cat].map((t) => ({ t, on: f[cat] === t, pick: () => this.setState({ f: { ...this.state.f, [cat]: t } }),
      style: 'border-radius:999px;padding:0 13px;min-height:40px;font:600 12px Montserrat,sans-serif;flex:none;cursor:pointer;' + (f[cat] === t ? 'background:#FFF0B6;border:1.5px solid #161512;color:#161512' : 'background:transparent;border:1px solid #D9D1B4;color:#3D3A32') }));
    const ok = (m) => (isAll(f.Florada) || m.florada === f.Florada) && (isAll(f.Origem) || m.mun === f.Origem) && (isAll(f.Produtor) || m.prod === f.Produtor) &&
      (isAll(f['Características']) || m.cor === f['Características'] || m.perfil === f['Características']) &&
      (!q || (m.nome + ' ' + m.prod + ' ' + m.mun).toLowerCase().indexOf(q.toLowerCase()) > -1);
    const lista = M.filter(ok).map((m) => ({ ...m, nomeUp: m.nome.toUpperCase() }));
    return { cats, opts, lista, q, setQ: (e) => this.setState({ q: e.target.value }), count: lista.length === 0 ? 'NENHUM MEL COM ESSES FILTROS' : lista.length + (lista.length === 1 ? ' MEL' : ' MÉIS') };
  }
}
</script>
</body>
</html>
