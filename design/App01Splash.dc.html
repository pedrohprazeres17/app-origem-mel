<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Splash — Origem</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Montserrat:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#FFF0B6;font-family:Montserrat,sans-serif;color:#161512;position:relative;overflow:hidden;display:flex;flex-direction:column">
<div aria-hidden="true" style="height:54px;flex:none"></div>

<main style="flex:1;min-height:0;overflow:hidden;position:relative;display:flex;flex-direction:column">
<a href="App02OnbA.dc.html" aria-label="Entrar no aplicativo" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;text-decoration:none;color:#161512;position:relative">
<span aria-hidden="true" style="position:absolute;right:-70px;top:-40px;width:200px;height:231px;background:#FFDE59;opacity:.55;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)"></span>
<span aria-hidden="true" style="position:absolute;left:-40px;bottom:80px;width:110px;height:127px;background:#FFDE59;opacity:.55;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)"></span>
<span style="width:150px;height:173px;background:#FFDE59;display:flex;align-items:center;justify-content:center;flex:none;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);"><span style="width:70px;height:81px;background:#161512;display:flex;align-items:center;justify-content:center;flex:none;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);"><span style="width:26px;height:30px;background:#FFDE59;display:flex;align-items:center;justify-content:center;flex:none;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);"></span></span></span>
<span style="display:flex;flex-direction:column;align-items:center;gap:8px"><span style="font-family:Anton,sans-serif;font-size:64px;line-height:1;letter-spacing:.04em">ORIGEM</span><span style="font-size:10px;font-weight:700;letter-spacing:.16em;font-size:11px">INFORMAÇÃO E ORIGEM DO MEL</span></span>
</a>
<div style="display:flex;flex-direction:column;align-items:center;gap:22px;padding:0 32px 40px">
<span style="font-family:Anton,sans-serif;font-size:28px;line-height:1;text-align:center">CONHEÇA O MEL<br>ALÉM DO POTE.</span>
<div role="status" aria-label="Carregando" style="display:flex;gap:10px;align-items:center"><sc-for list="{{dots}}" as="d" hint-placeholder-count="3"><span style="{{d.style}}"></span></sc-for></div>
</div>
</main>
<div aria-hidden="true" style="height:34px;flex:none"></div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { i: 0 }; }
  componentDidMount() { this.t = setInterval(() => this.setState({ i: (this.state.i + 1) % 3 }), 450); }
  componentWillUnmount() { clearInterval(this.t); }
  renderVals() {
    const i = this.state.i;
    return { dots: [0, 1, 2].map((k) => ({ style: 'width:14px;height:16px;background:#161512;display:block;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);transition:opacity .35s ease,transform .35s ease;opacity:' + (k === i ? 1 : 0.22) + ';transform:scale(' + (k === i ? 1.15 : 1) + ')' })) };
  }
}
</script>
</body>
</html>
