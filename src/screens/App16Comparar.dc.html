<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Compare os méis</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Montserrat:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#FFFCF1;font-family:Montserrat,sans-serif;color:#161512;position:relative;overflow:hidden;display:flex;flex-direction:column">
<div aria-hidden="true" style="height:54px;flex:none"></div>
<header style="height:56px;flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 16px;position:relative;z-index:2"><a href="#App11Mel/{{a}}" aria-label="Voltar" style="width:44px;height:44px;border-radius:50%;background:#FFFCF1;border:1.5px solid #161512;display:flex;align-items:center;justify-content:center;box-sizing:border-box;flex:none"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#161512" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a><span style="font-size:13px;font-weight:700;letter-spacing:.06em">COMPARAR</span><div style="display:flex;gap:8px;min-width:44px;justify-content:flex-end"></div></header>
<main style="flex:1;min-height:0;overflow:hidden;position:relative;display:flex;flex-direction:column">
<div style="padding:4px 20px 0;display:flex;flex-direction:column;gap:12px">
<h1 style="margin:0;font-family:Anton,sans-serif;font-weight:400;font-size:38px;line-height:.92;">COMPARE OS MÉIS</h1>
<div style="display:grid;grid-template-columns:minmax(0,1fr) 34px minmax(0,1fr);gap:6px;align-items:end">
<label style="display:flex;flex-direction:column;gap:4px;font-size:9px;font-weight:700;letter-spacing:.14em">MEL A<select value="{{a}}" onChange="{{setA}}" style="{{selA}}"><sc-for list="{{opts}}" as="o" hint-placeholder-count="4"><option value="{{o.id}}">{{o.label}}</option></sc-for></select></label>
<span style="margin-bottom:6px"><span style="width:34px;height:39px;background:#161512;display:flex;align-items:center;justify-content:center;flex:none;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);color:#FFDE59;font-family:Anton,sans-serif;font-size:13px">VS</span></span>
<label style="display:flex;flex-direction:column;gap:4px;font-size:9px;font-weight:700;letter-spacing:.14em">MEL B<select value="{{b}}" onChange="{{setB}}" style="{{selB}}"><sc-for list="{{opts}}" as="o" hint-placeholder-count="4"><option value="{{o.id}}">{{o.label}}</option></sc-for></select></label>
</div>
<dl style="margin:0;display:flex;flex-direction:column">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="7">
<div style="{{r.wrap}}"><dt style="display:flex;flex-direction:column;gap:2px;font-size:9px;font-weight:700;letter-spacing:.12em">{{r.label}}<span style="font-size:9px;font-weight:600;letter-spacing:.02em;color:#5E5A4E">{{r.tag}}</span></dt><dd style="{{r.sa}}">{{r.va}}</dd><dd style="{{r.sb}}">{{r.vb}}</dd></div>
</sc-for>
</dl>
<p style="margin:0;font-size:13px;line-height:1.5;font-weight:500">As diferenças fazem parte da origem e das características naturais de cada mel.</p>
</div>
</main>
<nav aria-label="Navegação principal" style="height:88px;flex:none;box-sizing:border-box;border-top:1px solid #E6DFC4;background:#FFFCF1;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:start;padding:6px 6px 34px;position:relative;z-index:3"><a href="App05Home.dc.html" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;color:#5E5A4E;font-size:10px;font-weight:600;min-height:44px"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#5E5A4E" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-6 8 6v9H4z"></path><path d="M10 20v-5h4v5"></path></svg>Início<span style="width:6px;height:7px;background:transparent;display:block;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);margin-top:1px"></span></a><a href="App17Meis.dc.html" aria-current="page" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;color:#161512;font-size:10px;font-weight:700;min-height:44px"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#161512" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"></path></svg>Méis<span style="width:6px;height:7px;background:#FFDE59;display:block;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);margin-top:1px"></span></a><a href="App06Scanner.dc.html" aria-label="Escanear QR Code" style="display:flex;flex-direction:column;align-items:center;gap:2px;margin-top:-30px;text-decoration:none;color:#161512;font-size:10px;font-weight:700"><span style="width:66px;height:76px;background:#161512;display:flex;align-items:center;justify-content:center;flex:none;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);"><span style="width:58px;height:67px;background:#FFDE59;display:flex;align-items:center;justify-content:center;flex:none;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#161512" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"></path><path d="M7 12h10"></path></svg></span></span>SCAN</a><a href="App18Produtores.dc.html" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;color:#5E5A4E;font-size:10px;font-weight:600;min-height:44px"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#5E5A4E" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="3.5"></circle><path d="M5 20c1-4 4-6 7-6s6 2 7 6"></path></svg>Produtores<span style="width:6px;height:7px;background:transparent;display:block;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);margin-top:1px"></span></a><a href="App21Salvos.dc.html" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;color:#5E5A4E;font-size:10px;font-weight:600;min-height:44px"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#5E5A4E" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 4h12v16l-6-4-6 4z"></path></svg>Salvos<span style="width:6px;height:7px;background:transparent;display:block;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);margin-top:1px"></span></a></nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) {
    super(p);
    const ok = (id) => !!Origem.mel(id);
    const ids = String(p.param || '').split(',').filter(ok);
    const saved = Origem.saved().map((x) => x.mel.id);
    const a = ids[0] || 'lar';
    const b = ids[1] || saved.filter((x) => x !== a)[0] || (a === 'mulb' ? 'lar' : 'mulb');
    this.state = { a, b, anim: false };
  }
  componentWillUnmount() { clearTimeout(this.t); }
  pick(k, val) { this.setState({ [k]: val, anim: true }); clearTimeout(this.t); this.t = setTimeout(() => this.setState({ anim: false }), 30); }
  renderVals() {
    const M = Origem.meis;
    const by = {}; M.forEach((m) => { by[m.id] = m; });
    const L = [['Origem', 'mun'], ['Produtor', 'prod'], ['Florada', 'florada'], ['Cor', 'cor'], ['Perfil', 'perfil'], ['Cristalização', 'crist'], ['Colheita', 'colheita']];
    const A = by[this.state.a] || M[0], B = by[this.state.b] || M[1], an = this.state.anim;
    const sel = (t) => 'font:700 13px Montserrat,sans-serif;color:#161512;background:' + t + ';border:1.5px solid #161512;border-radius:12px;padding:0 8px;min-height:46px;width:100%';
    const cell = (x, bg, same) => 'margin:0;background:' + bg + ';border-radius:10px;padding:0 9px;min-height:36px;display:flex;align-items:center;line-height:1.2;' +
      (an ? 'opacity:0;transform:translateX(14px);transition:none;' : 'opacity:1;transform:none;transition:opacity .35s ease,transform .35s ease;') +
      (x === 'Não informado' ? 'font-size:11px;font-style:italic;font-weight:600;color:#5E5A4E' : same ? 'font-size:12px;font-weight:500;color:#3D3A32' : 'font-size:13px;font-weight:700;color:#161512');
    const short = (m, k) => k === 'mun' ? m.mun.replace('São José dos Pinhais', 'S. J. dos Pinhais') : m[k];
    const rows = L.map(([l, k]) => { const va = short(A, k), vb = short(B, k), same = va === vb; return { label: l.toUpperCase(), tag: same ? 'igual' : 'diferente', va, vb,
      wrap: 'display:grid;grid-template-columns:82px minmax(0,1fr) minmax(0,1fr);gap:6px;align-items:center;padding:5px 0;border-top:1.5px solid ' + (same ? '#D9D1B4' : '#161512'),
      sa: cell(va, A.tint, same), sb: cell(vb, B.tint, same) }; });
    return { rows, a: this.state.a, b: this.state.b, selA: sel(A.tint), selB: sel(B.tint),
      opts: M.map((m) => ({ id: m.id, label: m.florada + ' · ' + m.prod.slice(-1) + (M.filter((x) => x.florada === m.florada && x.prod === m.prod).length > 1 ? ' · ' + m.lote : '') })),
      setA: (e) => this.pick('a', e.target.value), setB: (e) => this.pick('b', e.target.value) };
  }
}
</script>
</body>
</html>
