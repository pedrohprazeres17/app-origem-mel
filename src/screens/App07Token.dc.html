<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Digitar token</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Montserrat:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#FFFCF1;font-family:Montserrat,sans-serif;color:#161512;position:relative;overflow:hidden;display:flex;flex-direction:column">
<div aria-hidden="true" style="height:54px;flex:none"></div>
<header style="height:56px;flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 16px;position:relative;z-index:2"><a href="App06Scanner.dc.html" aria-label="Voltar ao scanner" style="width:44px;height:44px;border-radius:50%;background:#FFFCF1;border:1.5px solid #161512;display:flex;align-items:center;justify-content:center;box-sizing:border-box;flex:none"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#161512" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a><span style="font-size:13px;font-weight:700;letter-spacing:.06em"></span><div style="display:flex;gap:8px;min-width:44px;justify-content:flex-end"></div></header>
<main style="flex:1;min-height:0;overflow:hidden;position:relative;display:flex;flex-direction:column">
<div style="padding:4px 20px 0;display:flex;flex-direction:column;gap:16px;flex:1">
<span style="width:56px;height:65px;background:#FFF0B6;display:flex;align-items:center;justify-content:center;flex:none;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#161512" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2"></rect><path d="M7 10h.01M11 10h.01M15 10h.01M7 14h10"></path></svg></span>
<div style="display:flex;flex-direction:column;gap:10px"><h1 style="margin:0;font-family:Anton,sans-serif;font-weight:400;font-size:44px;line-height:.92;">DIGITE O CÓDIGO</h1><p style="margin:0;font-size:15px;line-height:1.5;font-weight:500">Insira o token informado junto ao produto.</p></div>
<label style="display:flex;flex-direction:column;gap:8px"><span style="font-size:10px;font-weight:700;letter-spacing:.16em;">TOKEN DO PRODUTO / LOTE</span>
<span style="display:flex;align-items:center;border:2px solid #161512;border-radius:16px;min-height:62px;padding:0 16px;background:#FFFFFF;gap:2px"><b style="font-size:19px;letter-spacing:.06em">MEL-</b><input value="{{val}}" onChange="{{set}}" onKeyDown="{{key}}" aria-label="Token do produto, sem o prefixo MEL" inputmode="text" autocomplete="off" autocorrect="off" enterkeyhint="search" placeholder="____-___-_____" autocapitalize="characters" spellcheck="false" style="flex:1;min-width:0;border:0;outline:none;background:transparent;font:600 19px Montserrat,sans-serif;letter-spacing:.06em;color:#161512;font-variant-numeric:tabular-nums;text-transform:uppercase"></span></label>
<div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><span style="font-size:13px;color:#5E5A4E">Exemplo: <b style="color:#161512;letter-spacing:.04em">MEL-2026-LAR-00421</b></span><button type="button" onClick="{{ex}}" style="background:transparent;border:0;font:700 12px Montserrat,sans-serif;letter-spacing:.06em;text-decoration:underline;color:#161512;min-height:44px;cursor:pointer">USAR</button></div>
<a href="{{goHref}}" onClick="{{go}}" style="display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;cursor:pointer;background:#FFDE59;color:#161512;border-radius:999px;text-decoration:none;font-size:13px;font-weight:700;letter-spacing:.1em;box-sizing:border-box;">LOCALIZAR MEL</a>
<div style="margin-top:auto;margin-bottom:8px;background:#FFF0B6;border-radius:18px;padding:14px;display:flex;gap:14px;align-items:center">
<span aria-hidden="true" style="width:92px;height:70px;background:#FFFCF1;border-radius:8px;border:1px solid #E6DFC4;display:flex;align-items:center;gap:6px;padding:8px;box-sizing:border-box;flex:none"><svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="#161512" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h2v2h-2zM18 18h2v2h-2zM18 14h2M14 18h2"></path></svg><span style="display:flex;flex-direction:column;gap:3px"><span style="width:34px;height:4px;background:#161512;border-radius:2px"></span><span style="width:28px;height:3px;background:#5E5A4E;border-radius:2px"></span><span style="width:30px;height:3px;background:#5E5A4E;border-radius:2px"></span></span></span>
<span style="display:flex;flex-direction:column;gap:3px"><b style="font-size:14px">Onde encontro o token?</b><span style="font-size:12px;line-height:1.45;color:#3D3A32">Logo abaixo do QR Code, na etiqueta ou na ficha do produto.</span></span></div>
</div>
</main>
<div aria-hidden="true" style="height:34px;flex:none"></div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { val: '' }; }
  renderVals() {
    return { val: this.state.val,
      set: (e) => this.setState({ val: e.target.value.toUpperCase().replace(/^\s*MEL-/, '') }),
      key: (e) => { if (e.key === 'Enter') { e.preventDefault(); if (this.state.val.trim()) location.hash = '#App08Loading'; } },
      goHref: this.state.val.trim() ? '#App08Loading' : null,
      go: () => { if (!this.state.val.trim()) { const i = document.querySelector('#app input'); if (i) i.focus(); } },
      ex: () => this.setState({ val: '2026-LAR-00421' }) };
  }
}
</script>
</body>
</html>
