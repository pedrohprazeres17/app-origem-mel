<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Etiqueta do pote — Área do revendedor</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Montserrat:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#FFFCF1;font-family:Montserrat,sans-serif;color:#161512;position:relative;overflow:hidden;display:flex;flex-direction:column">
<div aria-hidden="true" style="height:54px;flex:none"></div><header style="height:56px;flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 16px;position:relative;z-index:2"><a href="#App24Painel" aria-label="Voltar" style="width:44px;height:44px;border-radius:50%;background:#FFFCF1;border:1.5px solid #161512;display:flex;align-items:center;justify-content:center;box-sizing:border-box;flex:none"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#161512" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a><span style="font-size:13px;font-weight:700;letter-spacing:.06em">ETIQUETA</span><div style="display:flex;gap:8px;min-width:44px;justify-content:flex-end"></div></header><main style="flex:1;min-height:0;overflow:hidden;position:relative;display:flex;flex-direction:column">
<div style="padding:4px 20px 0;display:flex;flex-direction:column;gap:14px">
<h1 style="margin:0;font-family:Anton,sans-serif;font-weight:400;font-size:40px;line-height:.92;">ETIQUETA<br>DO POTE</h1>
<p style="margin:0;font-size:13px;line-height:1.5;color:#3D3A32">Modelo de 180 × 60 mm para dar a volta no pote. O QR Code abre a ficha deste mel no app.</p>
<label style="display:flex;flex-direction:column;gap:8px"><span style="font-size:10px;font-weight:700;letter-spacing:.16em;">MEL</span><select value="{{id}}" onChange="{{setMel}}" style="font:700 13px Montserrat,sans-serif;color:#161512;background:{{selTint}};border:1.5px solid #161512;border-radius:12px;padding:0 8px;min-height:46px;width:100%"><sc-for list="{{opts}}" as="o" hint-placeholder-count="4"><option value="{{o.id}}">{{o.label}}</option></sc-for></select></label>
<div data-raw aria-label="Prévia da etiqueta de {{m.nome}}" role="img" style="width:100%;aspect-ratio:3/1;position:relative;overflow:hidden;border-radius:12px;box-shadow:0 0 0 1px #E6DFC4;background:#FFFCF1"></div>
<div style="display:flex;flex-direction:column;gap:8px"><span style="font-size:10px;font-weight:700;letter-spacing:.16em;">QUANTIDADE</span><div role="group" style="display:flex;gap:6px;flex-wrap:wrap"><sc-for list="{{qtds}}" as="o" hint-placeholder-count="4"><button type="button" aria-pressed="{{o.on}}" onClick="{{o.pick}}" style="{{o.style}}">{{o.t}}</button></sc-for></div></div>
<span style="font-size:12px;color:#5E5A4E">{{resumo}}</span>
<button type="button" onClick="{{imprimir}}" style="display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;background:#FFDE59;color:#161512;border-radius:999px;text-decoration:none;font-size:13px;font-weight:700;letter-spacing:.1em;box-sizing:border-box;border:0;font-family:Montserrat,sans-serif;width:100%;cursor:pointer;"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#161512" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 9V3h10v6"></path><rect x="3" y="9" width="18" height="8" rx="2"></rect><path d="M7 14h10v7H7z"></path></svg>IMPRIMIR OU SALVAR PDF</button>
<button type="button" onClick="{{copiar}}" style="display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border:1.5px solid #161512;color:#161512;background:transparent;border-radius:999px;text-decoration:none;font-size:13px;font-weight:700;letter-spacing:.1em;box-sizing:border-box;font-family:Montserrat,sans-serif;width:100%;cursor:pointer;"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#161512" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h2v2h-2zM18 18h2v2h-2zM18 14h2M14 18h2"></path></svg>{{copiarTxt}}</button>
<div style="border:1.5px dashed #A69E80;border-radius:16px;padding:12px 14px;display:flex;gap:10px"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#161512" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5M12 8h.01"></path></svg><span style="font-size:12px;line-height:1.5;color:#3D3A32">Na janela de impressão, escolha <b style="color:#161512">Salvar como PDF</b> para mandar para a gráfica, com escala em 100% (tamanho real). Cabem 4 etiquetas por folha A4.</span></div>
<span aria-hidden="true" style="height:16px;flex:none"></span>
</div>
</main>
<div role="status" aria-live="polite" style="{{toastStyle}}"><span style="width:22px;height:25px;background:#FFDE59;display:flex;align-items:center;justify-content:center;flex:none;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="#161512" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span><span style="flex:1;font-size:13px;font-weight:600">{{toast}}</span></div>
<div aria-hidden="true" style="height:34px;flex:none"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { id: (Origem.mel(p.param) || Origem.meis[0]).id, qtd: 4, toast: '' }; }
  componentDidMount() {
    if (!Origem.rev()) return window.__go('App23Login');
    this.onResize = () => this.fit();
    window.addEventListener('resize', this.onResize);
  }
  componentWillUnmount() { window.removeEventListener('resize', this.onResize); clearTimeout(this.tt); }
  componentDidRender() {
    const box = document.querySelector('#app [data-raw]');
    if (!box) return;
    const m = Origem.mel(this.state.id) || Origem.meis[0];
    const key = m.id + '|' + m.atualizado + '|' + m.florada + '|' + m.cor + '|' + m.perfil + '|' + m.mun + '|' + m.prodId;
    if (box.__key !== key) { box.__key = key; box.innerHTML = Origem.labelHTML(m, Origem.linkFor(m)); }
    this.fit();
  }
  fit() {
    const box = document.querySelector('#app [data-raw]'), el = box && box.firstElementChild;
    if (!el) return;
    const s = box.clientWidth / el.offsetWidth;
    el.style.position = 'absolute'; el.style.left = '0'; el.style.top = '0';
    el.style.transformOrigin = '0 0'; el.style.transform = 'scale(' + s + ')';
  }
  aviso(t) { this.setState({ toast: t }); clearTimeout(this.tt); this.tt = setTimeout(() => this.setState({ toast: '' }), 2200); }
  renderVals() {
    const m = Origem.mel(this.state.id) || Origem.meis[0], q = this.state.qtd;
    const chip = (on) => 'border-radius:999px;padding:0 13px;min-height:40px;font:600 12px Montserrat,sans-serif;flex:none;cursor:pointer;' + (on ? 'background:#FFF0B6;border:1.5px solid #161512;color:#161512' : 'background:transparent;border:1px solid #D9D1B4;color:#3D3A32');
    const folhas = Math.ceil(q / 4);
    return { m, id: m.id, selTint: m.tint,
      opts: Origem.meis.map((x) => ({ id: x.id, label: x.nome + ' · ' + x.prod + ' · ' + x.lote })),
      setMel: (e) => { this.setState({ id: e.target.value }); history.replaceState(history.state, '', '#App26Etiqueta/' + e.target.value); },
      qtds: [1, 4, 8, 12].map((n) => ({ t: n === 1 ? '1 etiqueta' : n + ' etiquetas', on: q === n, style: chip(q === n), pick: () => this.setState({ qtd: n }) })),
      resumo: q + (q === 1 ? ' etiqueta' : ' etiquetas') + ' · ' + folhas + (folhas === 1 ? ' folha A4' : ' folhas A4'),
      imprimir: () => {
        const area = document.getElementById('print-area');
        const one = Origem.labelHTML(m, Origem.linkFor(m));
        let html = '';
        for (let i = 0; i < q; i++) html += one;
        area.innerHTML = html;
        setTimeout(() => window.print(), 60);
      },
      copiarTxt: 'COPIAR LINK DO QR CODE',
      copiar: () => {
        const link = Origem.linkFor(m);
        const ok = () => this.aviso('Link copiado');
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(link).then(ok, ok); else ok();
      },
      toast: this.state.toast,
      toastStyle: 'position:absolute;left:16px;right:16px;bottom:calc(var(--sab) + 18px);z-index:5;background:#161512;color:#FFFCF1;border-radius:16px;padding:12px 12px 12px 16px;display:flex;align-items:center;gap:10px;transition:opacity .3s ease,transform .3s ease;' + (this.state.toast ? 'opacity:1;transform:none' : 'opacity:0;transform:translateY(16px);pointer-events:none') };
  }
}
</script>
</body>
</html>
