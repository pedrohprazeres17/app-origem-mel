<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Entrar — Área do revendedor</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Montserrat:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#FFFCF1;font-family:Montserrat,sans-serif;color:#161512;position:relative;overflow:hidden;display:flex;flex-direction:column">
<div aria-hidden="true" style="height:54px;flex:none"></div><header style="height:56px;flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 16px;position:relative;z-index:2"><a href="#App05Home" aria-label="Voltar" style="width:44px;height:44px;border-radius:50%;background:#FFFCF1;border:1.5px solid #161512;display:flex;align-items:center;justify-content:center;box-sizing:border-box;flex:none"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#161512" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a><span style="font-size:13px;font-weight:700;letter-spacing:.06em">ÁREA DO REVENDEDOR</span><div style="display:flex;gap:8px;min-width:44px;justify-content:flex-end"></div></header><main style="flex:1;min-height:0;overflow:hidden;position:relative;display:flex;flex-direction:column">
<div style="padding:4px 20px 0;display:flex;flex-direction:column;gap:16px;flex:1">
<span style="width:56px;height:65px;background:#FFF0B6;display:flex;align-items:center;justify-content:center;flex:none;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#161512" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="3.5"></circle><path d="M5 20c1-4 4-6 7-6s6 2 7 6"></path></svg></span>
<div style="display:flex;flex-direction:column;gap:10px"><h1 style="margin:0;font-family:Anton,sans-serif;font-weight:400;font-size:44px;line-height:.92;">ENTRAR</h1><p style="margin:0;font-size:15px;line-height:1.5;font-weight:500">Acesse para editar os méis cadastrados e fazer as etiquetas dos lotes.</p></div>
<label style="display:flex;flex-direction:column;gap:8px"><span style="font-size:10px;font-weight:700;letter-spacing:.16em;">E-MAIL</span>
<span style="display:flex;align-items:center;border:2px solid #161512;border-radius:16px;min-height:56px;padding:0 16px;background:#FFFFFF;gap:2px"><input type="email" value="{{email}}" onChange="{{setEmail}}" onKeyDown="{{key}}" placeholder="voce@exemplo.com" autocomplete="username" autocapitalize="off" spellcheck="false" enterkeyhint="next" style="flex:1;min-width:0;border:0;outline:none;background:transparent;font:600 16px Montserrat,sans-serif;color:#161512"></span></label>
<label style="display:flex;flex-direction:column;gap:8px"><span style="font-size:10px;font-weight:700;letter-spacing:.16em;">SENHA</span>
<span style="display:flex;align-items:center;border:2px solid #161512;border-radius:16px;min-height:56px;padding:0 16px;background:#FFFFFF;gap:2px"><input type="{{senhaType}}" value="{{senha}}" onChange="{{setSenha}}" onKeyDown="{{key}}" placeholder="••••••" autocomplete="current-password" enterkeyhint="go" style="flex:1;min-width:0;border:0;outline:none;background:transparent;font:600 16px Montserrat,sans-serif;color:#161512"><button type="button" onClick="{{toggleSenha}}" aria-label="{{senhaLabel}}" style="background:transparent;border:0;font:700 11px Montserrat,sans-serif;letter-spacing:.06em;color:#161512;min-height:44px;padding:0 0 0 8px;cursor:pointer">{{senhaBtn}}</button></span></label>
<sc-if value="{{erro}}" hint-placeholder-val="{{ false }}"><span role="alert" style="font-size:13px;font-weight:600;background:#FFF0B6;border-radius:12px;padding:10px 12px">{{erro}}</span></sc-if>
<div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><span style="font-size:13px;color:#5E5A4E">Demonstração: <b style="color:#161512">qualquer e-mail e senha</b></span><button type="button" onClick="{{demo}}" style="background:transparent;border:0;font:700 12px Montserrat,sans-serif;letter-spacing:.06em;text-decoration:underline;color:#161512;min-height:44px;cursor:pointer">USAR</button></div>
<button type="button" onClick="{{entrar}}" style="display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;background:#FFDE59;color:#161512;border-radius:999px;text-decoration:none;font-size:13px;font-weight:700;letter-spacing:.1em;box-sizing:border-box;border:0;font-family:Montserrat,sans-serif;width:100%;cursor:pointer;">ENTRAR</button>
<div style="margin-top:auto;margin-bottom:8px;background:#FFF0B6;border-radius:18px;padding:14px;display:flex;gap:14px;align-items:center">
<span aria-hidden="true" style="width:44px;height:51px;background:#FFFCF1;display:flex;align-items:center;justify-content:center;flex:none;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#161512" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12V4a1 1 0 0 1 1-1h8l9 9-9 9z"></path><circle cx="7.5" cy="7.5" r="1.5"></circle></svg></span>
<span style="display:flex;flex-direction:column;gap:3px"><b style="font-size:14px">Versão de demonstração</b><span style="font-size:12px;line-height:1.45;color:#3D3A32">Não há servidor: o acesso e as alterações ficam salvos só neste aparelho.</span></span></div>
</div>
</main>
<div aria-hidden="true" style="height:34px;flex:none"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { email: '', senha: '', ver: false, erro: '' }; }
  componentDidMount() { if (Origem.rev()) window.__go('App24Painel'); }
  entrar() {
    const email = this.state.email.trim();
    if (!/^\S+@\S+\.\S+$/.test(email)) return this.setState({ erro: 'Digite um e-mail válido.' });
    if (this.state.senha.length < 4) return this.setState({ erro: 'A senha precisa ter pelo menos 4 caracteres.' });
    Origem.login(email);
    window.__go('App24Painel');
  }
  renderVals() {
    const v = this.state.ver;
    return { email: this.state.email, senha: this.state.senha, erro: this.state.erro,
      senhaType: v ? 'text' : 'password', senhaBtn: v ? 'OCULTAR' : 'MOSTRAR', senhaLabel: v ? 'Ocultar senha' : 'Mostrar senha',
      setEmail: (e) => this.setState({ email: e.target.value, erro: '' }),
      setSenha: (e) => this.setState({ senha: e.target.value, erro: '' }),
      toggleSenha: () => this.setState({ ver: !v }),
      key: (e) => { if (e.key === 'Enter') { e.preventDefault(); this.entrar(); } },
      demo: () => this.setState({ email: 'revenda@origem.app', senha: 'origem', erro: '' }),
      entrar: () => this.entrar() };
  }
}
</script>
</body>
</html>
