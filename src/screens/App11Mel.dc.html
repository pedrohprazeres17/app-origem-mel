x:none;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#161512" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"></path><path d="M7 12h10"></path></svg></span></span>SCAN</a><a href="App18Produtores.dc.html" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;color:#5E5A4E;font-size:10px;font-weight:600;min-height:44px"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#5E5A4E" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="3.5"></circle><path d="M5 20c1-4 4-6 7-6s6 2 7 6"></path></svg>Produtores<span style="width:6px;height:7px;background:transparent;display:block;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);margin-top:1px"></span></a><a href="App21Salvos.dc.html" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;color:#5E5A4E;font-size:10px;font-weight:600;min-height:44px"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#5E5A4E" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 4h12v16l-6-4-6 4z"></path></svg>Salvos<span style="width:6px;height:7px;background:transparent;display:block;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);margin-top:1px"></span></a></nav>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { toast: false }; }
  componentWillUnmount() { clearTimeout(this.tt); }
  saveVals(m) {
    const s = Origem.isSaved(m.id);
    return { saved: s, unsaved: !s, saveLabel: s ? 'Remover dos salvos' : 'Salvar este mel',
      saveStyle: 'width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;box-sizing:border-box;transition:transform .25s ease,background .25s ease;' + (s ? 'background:#FFDE59;border:0;transform:scale(1.08)' : 'background:#FFFCF1;border:1.5px solid #161512;transform:scale(1)'),
      toastStyle: 'position:absolute;left:16px;right:16px;bottom:102px;z-index:5;background:#161512;color:#FFFCF1;border-radius:16px;padding:12px 12px 12px 16px;display:flex;align-items:center;gap:10px;transition:opacity .3s ease,transform .3s ease;' + (this.state.toast ? 'opacity:1;transform:none' : 'opacity:0;transform:translateY(16px);pointer-events:none'),
      toggleSave: () => { const ns = Origem.toggleSaved(m.id); this.setState({ toast: ns }); clearTimeout(this.tt); if (ns) this.tt = setTimeout(() => this.setState({ toast: false }), 2600); } };
  }

  renderVals() { const m = Origem.mel(this.props.param) || Origem.meis[0]; return { m, ...this.saveVals(m) }; }
}
</script>
